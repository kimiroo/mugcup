<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mugcup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="head-title">mugcup ☕️</div>
    </header>

    <section class="view" id="view-settings" hidden>
      <section class="card">
        <h2>Presets</h2>
        <ul class="preset-list" id="presetList"></ul>
        <div class="preset-add">
          <input type="text" id="presetMinutes" placeholder="e.g. 1h30m, 45m, or 0 for indefinite">
          <button class="btn" id="btnAddPreset">+ Add</button>
        </div>
      </section>

      <section class="card">
        <h2>General</h2>
        <label class="switch-row">
          <span>Keep display on</span>
          <span class="switch"><input type="checkbox" id="chkDisplayOn"><span class="track"><span class="thumb"></span></span></span>
        </label>
        <label class="switch-row">
          <span>Start automatically with Windows</span>
          <span class="switch"><input type="checkbox" id="chkAutoStart"><span class="track"><span class="thumb"></span></span></span>
        </label>
        <label class="switch-row">
          <span>Automatically check for updates</span>
          <span class="switch"><input type="checkbox" id="chkAutoUpdateCheck"><span class="track"><span class="thumb"></span></span></span>
        </label>
        <label class="switch-row switch-row--nested">
          <span>Automatically install updates</span>
          <span class="switch"><input type="checkbox" id="chkAutoUpdateApply"><span class="track"><span class="thumb"></span></span></span>
        </label>
        <label class="select-row">
          <span>Tray click action</span>
          <select id="trayClickAction">
            <option value="cycle">Cycle through presets</option>
            <option value="indefinite">Indefinite</option>
            <option value="menu">Open tray menu</option>
          </select>
        </label>
      </section>
    </section>

    <section class="view" id="view-custom" hidden>
      <section class="card">
        <h2>Custom</h2>
        <div class="tabs">
          <button class="tab active" id="tabDuration" data-mode="duration" type="button">For a duration</button>
          <button class="tab" id="tabUntil" data-mode="until" type="button">Until a date &amp; time</button>
        </div>

        <div class="mode-pane" id="paneDuration">
          <div class="duration-row">
            <input type="text" id="freeText" placeholder="e.g. 1h30m, 45m">
            <button class="btn btn-accent" id="btnStartDuration">Start</button>
          </div>
        </div>

        <div class="mode-pane" id="paneUntil" hidden>
          <label class="date-toggle">
            <span class="switch"><input type="checkbox" id="chkWithDate"><span class="track"><span class="thumb"></span></span></span>
            <span>Choose a specific date</span>
          </label>
          <div class="duration-row">
            <input type="time" id="untilTime" step="1">
            <input type="datetime-local" id="untilDateTime" hidden>
            <button class="btn btn-accent" id="btnStartUntil">Start</button>
          </div>
        </div>
      </section>

      <div class="quick-row">
        <button class="btn" id="btnCancelCustom">Cancel</button>
      </div>
    </section>

    <section class="view" id="view-about" hidden>
      <section class="card about-card">
        <div class="about-title">mugcup</div>
        <p class="about-tagline">Keep your PC awake, on your terms.</p>
        <div class="about-version" id="aboutVersion">Version —</div>
        <div class="quick-row">
          <button class="btn" id="btnRepo">View on GitHub</button>
          <button class="btn" id="btnCheckUpdate">Check for Updates</button>
        </div>
      </section>

      <div class="quick-row">
        <button class="btn btn-accent" id="btnCloseAbout">Close</button>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
